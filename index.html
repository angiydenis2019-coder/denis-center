<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DC</title>
  <meta name="theme-color" content="#ffffff">
  <script>
    // Aplica el estilo elegido antes de dibujar (evita el parpadeo)
    (function () {
      var t = 'clara';
      try { t = localStorage.getItem('dc_tema') || 'clara'; } catch (e) {}
      document.documentElement.dataset.tema = t;
      var c = { clara: '#ffffff', azul: '#0b3d7a', oscura: '#0c1420' }[t] || '#ffffff';
      document.querySelector('meta[name=theme-color]').setAttribute('content', c);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="#/inicio" aria-label="Ir a Inicio">
      <img class="marca-img" src="iconos/emblema.png" alt="" width="36" height="36">
      <span class="marca-txt">DC</span>
    </a>
    <div class="barra-der">
      <button id="estado-sync" class="estado-sync" hidden></button>
      <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar estilo" title="Cambiar estilo" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 10c0-4.4-4.5-8-10-8z"/></svg>
      </button>
      <button id="btn-salir" class="btn-icono" type="button" aria-label="Salir" title="Salir" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div id="aviso-offline" class="aviso" hidden>Sin señal: podés seguir usando la app. Lo que cargues se guarda en el celular y se sube solo cuando vuelva la señal.</div>

  <main id="app" aria-live="polite"></main>

  <footer class="pie-dc" aria-label="DC">
    <img src="iconos/emblema.png" alt="" width="26" height="33">
    <span><b>DC</b> · Gestión para técnicos</span>
  </footer>

  <a id="fab" class="fab" href="#/trabajo-nuevo" aria-label="Nuevo trabajo o turno" hidden>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </a>

  <nav id="nav" class="nav" hidden>
    <a href="#/inicio" data-ruta="inicio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/agenda" data-ruta="agenda"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Agenda</span></a>
    <span class="nav-hueco" aria-hidden="true"></span>
    <a href="#/clientes" data-ruta="clientes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg><span>Clientes</span></a>
    <a href="#/ajustes" data-ruta="ajustes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Ajustes</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
